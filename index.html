<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' file: https://cdn.jsdelivr.net; style-src 'self' file: 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' file: data:; connect-src 'self' https:; frame-src 'self' https://login.microsoftonline.com; manifest-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="theme-color" content="#27136c">
  <meta name="description" content="Controle financeiro da tesouraria da Sociedade Acadêmica Militar">
  <title>Tesouraria SAM</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden>
    Demonstração com dados fictícios.
    <a href="./">Sair</a>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><img src="icons/logo.svg" alt="" width="28" height="23"></span>
      <div>
        <strong>Tesouraria SAM</strong>
        <span id="status-line" class="status-line" role="status"></span>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" data-act="refresh" aria-label="Atualizar agora" title="Atualizar agora">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 3v5h-5"/></svg>
      </button>
      <button type="button" class="icon-btn" data-act="go" data-tab="config" aria-label="Configurações" title="Configurações">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="tabs" aria-label="Seções">
      <button type="button" class="tab" data-act="go" data-tab="inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Início</span>
      </button>
      <button type="button" class="tab" data-act="go" data-tab="fixos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 1.5-2M4 12l1 1 1.5-2M4 18l1 1 1.5-2"/></svg>
        <span>Gastos fixos</span>
      </button>
      <button type="button" class="tab" data-act="go" data-tab="projetos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v13H3zM8 7V4h8v3M3 13h18"/></svg>
        <span>Projetos</span>
      </button>
      <button type="button" class="tab" data-act="go" data-tab="orcamento">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M16 3.5A9 9 0 0 1 20.5 8H16z"/></svg>
        <span>Orçamento</span>
      </button>
      <button type="button" class="tab" data-act="go" data-tab="balancete">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg>
        <span>Balancete</span>
      </button>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/microsoft.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/inicio.js"></script>
  <script src="js/views/fixos.js"></script>
  <script src="js/views/projetos.js"></script>
  <script src="js/views/orcamento.js"></script>
  <script src="js/views/balancete.js"></script>
  <script src="js/views/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
